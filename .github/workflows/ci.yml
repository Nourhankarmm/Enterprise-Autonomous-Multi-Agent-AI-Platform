name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .audit
      - run: .audit/bin/pip install -r tools-audit.lock.txt
      - run: mkdir -p .data && .audit/bin/python -m pip_audit --disable-pip --no-deps -r requirements.lock.txt --format json --output .data/phase6-dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-dependency-audit-${{ github.sha }}
          path: .data/phase6-dependency-audit.json
          if-no-files-found: error
          include-hidden-files: true
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: phase1-ci
      API_BIND_PORT: 18000
      POSTGRES_PASSWORD: ci-only-password
      WORKFLOW_POLL_SECONDS: '1'
      REQUIRE_OCR: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -c requirements.lock.txt '.[test]'
      - name: Install local OCR engine and language data
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core
      - run: python scripts/run_regressions.py --output .data/phase6-regressions.json
      - run: python scripts/build_coverage.py
      - run: python -m unittest discover -s tests -p test_phase_one.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: python -m unittest discover -s tests -p test_phase_two.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: python -m unittest discover -s tests -p test_phase_three.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: node --check web/app.js
      - run: node --check web/workflows.js
      - run: node --check web/dashboard.js
      - run: python -m unittest discover -s tests -p test_phase_four.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: python -m unittest discover -s tests -p test_phase_five.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: python -m unittest discover -s tests -p test_phase_six.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - run: python -m unittest discover -s tests -p test_phase_seven.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://platform:ci-only-password@localhost:5432/platform_test
      - name: Frozen synthetic evaluation
        run: python scripts/run_evaluation.py --output .data/phase6-evaluation.json
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
      - name: Start fresh Compose stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify containerized application and restart recovery
        run: python scripts/compose_smoke.py
      - name: Verify durable approvals and killed-worker recovery
        run: python scripts/durable_smoke.py
      - name: Replay real Temporal history
        run: |
          docker compose exec -T api python -c "from pathlib import Path; import sys; Path('/tmp/test_temporal_integration.py').write_bytes(sys.stdin.buffer.read())" < tests/test_temporal_integration.py
          docker compose exec -T api python -c "from pathlib import Path; import sys; Path('/tmp/crash_worker.py').write_bytes(sys.stdin.buffer.read())" < tests/crash_worker.py
          docker compose exec -T -e TEST_TEMPORAL_ADDRESS=temporal:7233 -e TEMPORAL_PROOF_OUTPUT=/tmp/temporal-recovery.json -e EVALUATION_SOURCE_SHA="$GITHUB_SHA" api python -m unittest discover -s /tmp -p test_temporal_integration.py -v
          docker compose exec -T api python -c "from pathlib import Path; import sys; sys.stdout.buffer.write(Path('/tmp/temporal-recovery.json').read_bytes())" > .data/phase6-temporal-recovery.json
      - name: Verify disposable backup restore
        run: python scripts/verify_compose_restore.py
      - name: Publish evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-evaluation-${{ github.sha }}
          path: .data/phase6-*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
