[project]
name = "enterprise-autonomous-ai-platform"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = ["pypdfium2>=5,<6", "pillow>=13,<14", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "langgraph>=1.0,<2", "openai>=2,<3", "httpx>=0.27,<1", "pypdf>=6,<7", "python-multipart>=0.0.20,<1", "psutil>=7,<8", "temporalio>=1.36,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["platform_api*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
