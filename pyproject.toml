[project]
name = "enterprise-autonomous-ai-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "langgraph>=1.0,<2", "openai>=2,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["platform_api*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
